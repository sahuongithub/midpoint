<style>
/* A title card commits to one look on purpose: near-black, so that cutting from
   here to the bright site reads like a curtain going up. Every colour is stated
   explicitly rather than inherited, so it holds whatever theme the viewer is in. */
:root{
  --ground:#080A0E;
  --ink:#F2F3F7;
  --ink-2:#8C93A3;
  --ink-3:#474D5C;
  --indigo:#7C8CFF;
  --clay:#FF7A63;
  --rule:#2A3040;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,sans-serif;
  overflow:hidden;
  cursor:pointer;
  -webkit-font-smoothing:antialiased;
}

/* ---------------------------------------------------------------
   BACKGROUND — the actual measured sample
   Forty real contracts from results/feed_audit.csv, each drawn as
   the thing it is: two prices with a gap between them. Width is the
   real quoted spread, log-scaled so the $3.06 outlier does not eat
   the frame. The wide ones glow warm, because in this project wide
   is what expensive looks like.
   --------------------------------------------------------------- */
#field{
  position:fixed;inset:0;
  pointer-events:none;
}
.sp{
  position:absolute;
  height:1px;
  transform-origin:50% 50%;
  opacity:0;
  animation:spIn 1500ms cubic-bezier(.2,.7,.3,1) forwards,
            spFloat var(--dur) ease-in-out infinite alternate var(--dur2);
}
.sp i{
  position:absolute;top:-4px;width:1.5px;height:10px;
  background:currentColor;opacity:1;
}
.sp i.a{left:0}
.sp i.b{right:0}
.sp b{
  position:absolute;left:0;right:0;top:0;height:1.5px;
  background:currentColor;opacity:.8;
}
/* the expensive ones carry the meaning, so let them actually glow */
.sp.wide i, .sp.wide b{box-shadow:0 0 10px currentColor}

/* the soft lift behind the centre, so the ground is never a flat block */
.vignette{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(46% 40% at 50% 47%, rgba(124,140,255,.13) 0%, rgba(8,10,14,0) 70%),
    radial-gradient(92% 86% at 50% 50%, rgba(8,10,14,0) 52%, rgba(8,10,14,.42) 84%, rgba(8,10,14,.72) 100%);
}

.stage{
  position:relative;
  height:100%;
  display:flex;align-items:center;justify-content:center;
}
.inner{width:min(1120px,84vw);text-align:center}

/* ---------------------------------------------------------------
   THE MARK
   The same object as every line behind it, brought forward and made
   sharp: a rule, a tick at each end, and a taller one at dead centre.
   That is the whole idea of the name — two prices exist, and the
   thing worth knowing sits exactly between them.
   --------------------------------------------------------------- */
.mark{position:relative;height:46px;width:100%;margin:0 auto clamp(30px,5.2vh,58px)}
.line{
  position:absolute;left:0;right:0;top:23px;height:1px;
  background:linear-gradient(90deg,
    rgba(42,48,64,0) 0%, var(--rule) 12%, var(--rule) 88%, rgba(42,48,64,0) 100%);
  transform:scaleX(0);
  animation:draw 1100ms cubic-bezier(.22,.61,.36,1) forwards 260ms;
}
.tick{
  position:absolute;top:15px;width:1px;height:17px;background:var(--ink-3);
  opacity:0;animation:appear 620ms ease forwards 1040ms;
}
.tick.l{left:12%}
.tick.r{right:12%}
.tick.mid{
  top:6px;height:35px;width:1.5px;background:var(--indigo);
  left:calc(50% - .75px);
  box-shadow:0 0 22px rgba(124,140,255,.6);
  transform:scaleY(0);
  animation:grow 700ms cubic-bezier(.16,.9,.3,1) forwards 1260ms;
}

/* ---------------------------------------------------------------
   THE NAME — letters rise in sequence, fast enough to read as one
   word settling rather than characters arriving one by one.
   --------------------------------------------------------------- */
h1{
  font-family:"Bricolage Grotesque","Public Sans",sans-serif;
  font-weight:700;
  font-size:clamp(52px,12.5vw,168px);
  line-height:.94;letter-spacing:-.03em;margin:0;
  display:flex;justify-content:center;white-space:nowrap;
}
h1 span{
  display:inline-block;opacity:0;transform:translateY(.34em);
  animation:rise 820ms cubic-bezier(.2,.7,.3,1) forwards;
}
h1 span:nth-child(1){animation-delay:1400ms}
h1 span:nth-child(2){animation-delay:1450ms}
h1 span:nth-child(3){animation-delay:1500ms}
h1 span:nth-child(4){animation-delay:1550ms}
h1 span:nth-child(5){animation-delay:1600ms}
h1 span:nth-child(6){animation-delay:1650ms}
h1 span:nth-child(7){animation-delay:1700ms}
h1 span:nth-child(8){animation-delay:1750ms}

.tag{
  margin:clamp(18px,3.1vh,34px) auto 0;
  font-weight:300;
  font-size:clamp(17px,2.35vw,30px);
  line-height:1.42;color:var(--ink-2);
  max-width:26ch;letter-spacing:.005em;
  opacity:0;animation:appear 1000ms ease forwards 2150ms;
}

.hint{
  position:fixed;left:0;right:0;bottom:26px;text-align:center;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);opacity:0;
  animation:hint 3800ms ease forwards 3300ms;
}

@keyframes draw   {to{transform:scaleX(1)}}
@keyframes grow   {to{transform:scaleY(1)}}
@keyframes appear {to{opacity:1}}
@keyframes rise   {to{opacity:1;transform:translateY(0)}}
@keyframes hint   {0%{opacity:0}22%{opacity:1}74%{opacity:1}100%{opacity:0}}
@keyframes spIn   {to{opacity:var(--op)}}
@keyframes spFloat{
  from{transform:translate3d(0,0,0)}
  to  {transform:translate3d(var(--dx),var(--dy),0)}
}

.reset *{animation:none !important}

@media (prefers-reduced-motion: reduce){
  .line{transform:scaleX(1);animation:none}
  .tick,.tag{opacity:1;animation:none}
  .tick.mid{transform:scaleY(1);animation:none}
  h1 span{opacity:1;transform:none;animation:none}
  .hint{opacity:1;animation:none}
  .sp{opacity:var(--op);animation:none}
}
</style>
</head>

   Straight out of results/feed_audit.csv. The background is the dataset. */
var SAMPLE = [[0,0.39],[0.01,0.145],[0.01,2.425],[0.01,0.025],[0.01,1.445],[0.01,0.545],
[0.02,3.39],[0.02,3.2],[0.02,0.11],[0.02,0.44],[0.03,2.545],[0.03,4.985],[0.03,13.215],
[0.04,5.56],[0.04,7.29],[0.04,2.7],[0.04,1.89],[0.06,11.95],[0.06,5.87],[0.07,7.475],
[0.07,6.705],[0.07,1.675],[0.09,10.445],[0.1,10.53],[0.11,17.685],[0.11,15.305],
[0.12,27.03],[0.13,3.035],[0.15,22.305],[0.23,19.925],[0.33,16.985],[0.4,17.53],
[0.5,15.23],[0.52,14.92],[0.53,14.425],[1,6.6],[1.9,22.82],[2.49,14.785],[2.95,15.425],
[3.06,15.48]];

(function () {
  var field = document.getElementById("field");
  var stage = document.getElementById("stage");
  var hint  = document.getElementById("hint");

  /* A deterministic shuffle: the field looks scattered, but it is the same
     scatter every time the page loads, so a re-shot take matches the last one. */
  function rng(seed) {
    return function () {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
  }

  function build() {
    var rand = rng(20260903);
    var W = window.innerWidth, H = window.innerHeight;
    var frag = document.createDocumentFragment();

    /* Three passes at different depths. The far ones are small, dim and slow;
       the near ones are longer, brighter and drift more -- ordinary parallax,
       which is what stops a scatter of lines reading as noise. */
    var LAYERS = [
      {n: 34, depth: 0.42, op: 0.34, blur: "0.7px"},
      {n: 26, depth: 0.72, op: 0.62, blur: "0.2px"},
      {n: 16, depth: 1.00, op: 0.95, blur: "0"}
    ];

    LAYERS.forEach(function (L) {
      for (var i = 0; i < L.n; i++) {
        var s = SAMPLE[Math.floor(rand() * SAMPLE.length)];
        var w = s[0];

        /* log scale, or the $3.06 outlier is the only thing you see */
        var norm = Math.log(1 + w / 0.01) / Math.log(1 + 3.06 / 0.01);
        var px = (26 + norm * 300) * L.depth;

        var el = document.createElement("div");
        el.className = "sp";

        var x = rand() * (W + 300) - 150;
        var y = rand() * H;

        /* Keep the field out of the words. The centre band stays clear so the
           name never has to fight the graphic behind it. */
        var cx = Math.abs(x + px / 2 - W / 2) / (W / 2);
        var cy = Math.abs(y - H / 2) / (H / 2);
        if (cx < 0.38 && cy < 0.24) { y = y < H / 2 ? y - H * 0.26 : y + H * 0.26; }
        if (y < -10 || y > H + 10) continue;

        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.width = px + "px";

        /* Wide is expensive, and expensive runs warm. Everything tight stays
           cool and quiet -- the same colour logic the site's bands use. */
        if (w >= 0.5) { el.style.color = "var(--clay)"; el.className = "sp wide"; }
        else if (w >= 0.2) { el.style.color = "#C6CCEA"; }
        else { el.style.color = "#8E97B4"; }

        el.style.setProperty("--op", (L.op * (0.62 + rand() * 0.5)).toFixed(3));
        el.style.setProperty("--dx", ((rand() - 0.5) * 34 * L.depth).toFixed(1) + "px");
        el.style.setProperty("--dy", ((rand() - 0.5) * 22 * L.depth).toFixed(1) + "px");
        el.style.setProperty("--dur", (9 + rand() * 11).toFixed(1) + "s");
        el.style.setProperty("--dur2", (rand() * 6).toFixed(1) + "s");
        el.style.animationDelay = (rand() * 900).toFixed(0) + "ms, 0s";
        if (L.blur !== "0") el.style.filter = "blur(" + L.blur + ")";

        el.innerHTML = '<i class="a"></i><b></b><i class="b"></i>';
        frag.appendChild(el);
      }
    });

    field.innerHTML = "";
    field.appendChild(frag);
  }

  function replay() {
    [stage, hint].forEach(function (el) { el.classList.add("reset"); });
    void stage.offsetWidth;
    [stage, hint].forEach(function (el) { el.classList.remove("reset"); });
    build();
  }

  build();
  document.addEventListener("click", replay);
  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter" || e.key === "r") { e.preventDefault(); replay(); }
  });

  var t;
  window.addEventListener("resize", function () {
    clearTimeout(t); t = setTimeout(build, 180);
  });
})();
</script>

</body>
</html>
